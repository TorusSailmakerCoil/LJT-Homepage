name: Check Pages Status

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get Pages site info
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages | tee pages.json
      - name: Check site URL
        run: |
          URL=$(jq -r '.html_url // empty' pages.json)
          echo "Pages URL: $URL"
          if [ -n "$URL" ]; then
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "$URL" || true
          fi
