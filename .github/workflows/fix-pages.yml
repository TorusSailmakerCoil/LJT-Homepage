name: Fix Pages Build Type

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Show Pages info
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages | tee pages.json
      - name: Set build type to workflow
        run: |
          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"build_type":"workflow"}' \
            https://api.github.com/repos/${{ github.repository }}/pages | tee update.json
      - name: Show updated Pages info
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
